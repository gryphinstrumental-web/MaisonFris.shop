<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maíson Fris — Luxury and Customs</title>
    <meta name="description" content="Maison Fris — Luxury and Customs on CivMC">
    <link rel="icon" type="image/png" href="2.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #646e96;
            --bg-dark: #5a5a80;
            --text: #f0eef4;
            --text-muted: #c4c0d4;
            --accent: #b8b4cc;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            position: relative;
        }

        body.landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Hamburger Menu */
        .hamburger {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 1000;
            cursor: pointer;
            width: 30px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .hamburger:hover {
            transform: scale(1.1);
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background: var(--text);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(8px, -8px);
        }

        /* Side Menu */
        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(90, 90, 128, 0.98);
            backdrop-filter: blur(10px);
            z-index: 999;
            transition: left 0.4s ease;
            padding: 5rem 2rem 2rem;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.3);
        }

        .side-menu.active {
            left: 0;
        }

        .side-menu nav {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .side-menu nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(184, 180, 204, 0.2);
        }

        .side-menu nav a:hover {
            color: var(--text);
            padding-left: 0.5rem;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: min(320px, 80vw);

            animation: fadeIn 1.8s ease;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: var(--accent);
            opacity: 0.6;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
        }

        .come-in-btn {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-muted);
            background: none;
            border: 1px solid rgba(184, 180, 204, 0.3);
            padding: 0.75rem 2.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.4s ease;
            animation: fadeIn 2.2s ease;
        }

        .come-in-btn:hover {
            color: var(--text);
            border-color: var(--accent);
            background: rgba(184, 180, 204, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .status {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a8d4a0;
            box-shadow: 0 0 8px rgba(168, 212, 160, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .links {
            margin-top: 1.5rem;
            display: flex;
            gap: 2rem;
            animation: fadeIn 2.2s ease;
        }

        .links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }

        .links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--text);
            transition: width 0.3s ease;
        }

        .links a:hover {
            color: var(--text);
        }

        .links a:hover::after {
            width: 100%;
        }

        /* Views - page routing */
        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Orderbook Page */
        .orderbook-page {
            min-height: 100vh;
            overflow-y: auto;
            padding: 2rem;
        }

        .exchange-content {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
        }


        .exchange-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .exchange-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        /* Search Bar */
        .search-bar {
            position: relative;
            max-width: 400px;
            margin: 0 auto 2rem;
        }

        .search-bar input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(184, 180, 204, 0.2);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-align: center;
            transition: all 0.3s ease;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.12);
        }


        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .equity-card.filtered-out {
            display: none !important;
        }

        /* Carousel - single card with arrows */
        .carousel-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .carousel-arrow {
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: color 0.3s ease;
            user-select: none;
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
        }

        .carousel-arrow:hover {
            color: var(--text);
        }

        .carousel-stage {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden;
        }

        .equity-card {
            display: none;
            max-width: 560px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(184, 180, 204, 0.1);
            border-radius: 10px;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
            animation: cardFadeIn 0.3s ease;
        }

        .equity-card.active-card {
            display: block;
        }

        .equity-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(184, 180, 204, 0.2);
        }

        .equity-card.unavailable {
            opacity: 0.5;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .equity-card-header {
            padding: 1.5rem 2rem 0.75rem;
            text-align: center;
        }

        .equity-card-header .ticker-display {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.08em;
            display: block;
            margin-bottom: 0.2rem;
        }

        .equity-card-header .company-name {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            display: block;
        }

        .equity-card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .book-side {
            padding: 1rem 2rem 1.5rem;
        }


        .book-side.ask {
            border-left: 1px solid rgba(184, 180, 204, 0.1);
        }

        .book-side-label {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .book-side.bid .book-side-label {
            color: #a8d4a0;
        }

        .book-side.ask .book-side-label {
            color: #d4a0a0;
        }

        .book-offer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }

        .book-offer .offer-info {
            display: flex;
            flex-direction: column;
            color: var(--text-muted);
        }

        .book-offer .offer-info .price {
            font-weight: 500;
            font-size: 1.05rem;
        }

        .book-side.bid .offer-info .price {
            color: #a8d4a0;
        }

        .book-side.ask .offer-info .price {
            color: #d4a0a0;
        }

        .book-offer .offer-info .qty {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .book-offer button {
            padding: 0.5rem 1.25rem;
            border: 1px solid;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Raleway', sans-serif;
            white-space: nowrap;
        }

        .book-offer button:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .book-side.bid button {
            background: rgba(168, 212, 160, 0.15);
            border-color: #a8d4a0;
            color: #a8d4a0;
        }

        .book-side.bid button:hover {
            background: rgba(168, 212, 160, 0.3);
        }

        .book-side.ask button {
            background: rgba(212, 160, 160, 0.15);
            border-color: #d4a0a0;
            color: #d4a0a0;
        }

        .book-side.ask button:hover {
            background: rgba(212, 160, 160, 0.3);
        }

        .book-empty {
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.5;
            font-style: italic;
        }

        .unavailable-label {
            padding: 0.5rem 2rem 1.5rem;
            font-size: 0.8rem;
            color: #d4a0a0;
            font-style: italic;
            opacity: 0.7;
            text-align: center;
        }


        @media (max-width: 600px) {
            .equity-card-body {
                grid-template-columns: 1fr;
            }
            .book-side.ask {
                border-left: none;
                border-top: 1px solid rgba(184, 180, 204, 0.1);
            }
            .book-side {
                padding: 0.75rem 1.25rem 1rem;
            }
            .equity-card-header {
                padding: 1.25rem 1.25rem 0.5rem;
            }
            .equity-card-header .ticker-display {
                font-size: 1.6rem;
            }
            .carousel-arrow {
                font-size: 1.4rem;
            }
        }

        /* Top Nav Bar */
        .top-nav {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 998;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem 2rem;
        }

        .top-nav .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: color 0.3s ease;
            font-family: 'Raleway', sans-serif;
        }

        .top-nav .nav-link:hover {
            color: var(--text);
        }

        .top-nav .nav-divider {
            width: 1px;
            height: 16px;
            background: rgba(184, 180, 204, 0.3);
        }

        .auth-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .auth-bar .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: rgba(88, 101, 242, 0.2);
            border: 1px solid rgba(88, 101, 242, 0.5);
            border-radius: 6px;
            color: #c4c0d4;
            font-family: 'Raleway', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .auth-bar .login-btn:hover {
            background: rgba(88, 101, 242, 0.35);
            color: var(--text);
        }

        .auth-bar .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .auth-bar .user-info img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(184, 180, 204, 0.3);
        }

        .auth-bar .logout-btn {
            background: none;
            border: 1px solid rgba(184, 180, 204, 0.2);
            border-radius: 4px;
            color: var(--text-muted);
            font-family: 'Raleway', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            padding: 0.25rem 0.6rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .auth-bar .logout-btn:hover {
            border-color: rgba(212, 160, 160, 0.5);
            color: #d4a0a0;
        }

        /* Admin Controls */
        .admin-badge {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: rgba(168, 212, 160, 0.15);
            border: 1px solid rgba(168, 212, 160, 0.3);
            color: #a8d4a0;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            margin-left: 0.5rem;
        }

        .admin-edit-btn {
            background: none;
            border: 1px solid rgba(184, 180, 204, 0.2);
            color: var(--text-muted);
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            transition: all 0.2s ease;
        }

        .admin-edit-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .admin-edit-btn.save {
            border-color: rgba(168, 212, 160, 0.4);
            color: #a8d4a0;
        }

        .admin-edit-btn.save:hover {
            background: rgba(168, 212, 160, 0.15);
        }

        .admin-edit-btn.cancel {
            border-color: rgba(212, 160, 160, 0.3);
            color: #d4a0a0;
        }

        .admin-inline-input {
            width: 80px;
            padding: 0.25rem 0.4rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(184, 180, 204, 0.3);
            border-radius: 3px;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            font-size: 0.85rem;
            text-align: center;
        }

        .admin-inline-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .admin-offer-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .admin-offer-row label {
            font-size: 0.65rem;
            color: var(--text-muted);
            min-width: 28px;
        }

        .admin-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }

        .admin-add-tier {
            background: none;
            border: 1px dashed rgba(184, 180, 204, 0.25);
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 0.4rem;
        }

        .admin-add-tier:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .admin-remove-tier {
            background: none;
            border: none;
            color: rgba(212, 160, 160, 0.6);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0 0.2rem;
            line-height: 1;
        }

        .admin-remove-tier:hover {
            color: #d4a0a0;
        }

        /* Order Form Modal */
        .order-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .order-modal.active {
            display: flex;
        }

        .order-form {
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .order-form h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .order-form .form-group {
            margin-bottom: 1.5rem;
        }

        .order-form label {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .order-form input,
        .order-form textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(184, 180, 204, 0.3);
            border-radius: 4px;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            font-size: 0.9rem;
        }

        .order-form input:focus,
        .order-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .order-form .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .order-form button {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-family: 'Raleway', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .order-form button.submit-btn {
            background: rgba(184, 180, 204, 0.2);
            color: var(--text);
        }

        .order-form button.submit-btn:hover {
            background: rgba(184, 180, 204, 0.3);
        }

        .order-form button.cancel-btn {
            background: transparent;
            color: var(--text-muted);
        }

        .order-form button.cancel-btn:hover {
            color: var(--text);
        }

        .order-summary {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .order-summary p {
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .order-summary .label {
            color: var(--text-muted);
        }

        .order-summary .value {
            color: var(--text);
            font-weight: 500;
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            z-index: 1;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Hamburger Menu -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <nav>
            <a href="/orderbook" onclick="navigateTo('/orderbook'); return false;">Pavian Exchange Orderbook</a>
        </nav>
    </div>

    <!-- Top Nav Bar (global) -->
    <div class="top-nav">
        <a href="/home" onclick="navigateTo('/home'); return false;" class="nav-link">Home</a>
        <div class="nav-divider"></div>
        <div class="auth-bar" id="authBar">
            <button class="login-btn" id="loginBtn" onclick="loginWithDiscord()">Sign in</button>
        </div>
    </div>

    <!-- Landing Page View -->
    <div class="view" id="landingView">
        <div class="container">
            <img src="2.png" alt="Maison Fris" class="logo">
            <button class="come-in-btn" onclick="loginWithDiscord()">Come In</button>
        </div>
    </div>

    <!-- Orderbook Page View -->
    <div class="view orderbook-page" id="orderbookView">
        <div class="exchange-content">

            <div class="exchange-header">
                <h1>Pavian Exchange Orderbook</h1>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search by ticker or company name...">
            </div>
            <div id="equityData" class="loading">Loading equities...</div>
        </div>
    </div>

    <!-- Order Form Modal -->
    <div class="order-modal" id="orderModal">
        <div class="order-form">
            <h2 id="orderTitle">Place Order</h2>

            <div class="order-summary" id="orderSummary"></div>

            <form id="orderForm">
                <div class="form-group">
                    <label for="minecraftIGN">Minecraft IGN *</label>
                    <input type="text" id="minecraftIGN" required placeholder="Your IGN">
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity * <span id="maxQtyLabel" style="color: var(--text-muted); font-weight: 300;"></span></label>
                    <input type="number" id="quantity" required min="1" placeholder="Number of shares" oninput="validateQuantity()">
                </div>

                <div class="form-group">
                    <label for="notes">Additional Notes</label>
                    <textarea id="notes" rows="3" placeholder="Optional notes or questions..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="cancel-btn" id="cancelOrder">Cancel</button>
                    <button type="submit" class="submit-btn">Submit Order</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            supabaseUrl: 'https://ubuypxqueqxvugstmtkx.supabase.co',
            supabaseKey: 'sb_publishable_ndTGBxW3c2bOdMzgOVvy7w_9py3MLUs',
            discordWebhook: 'https://discord.com/api/webhooks/1472730251372003474/aWcIylD6Ew7gOI1KyCLToj8aQfd7hsDJ8YqUdxniBmxSFaa_YwGAQKqwZH-gQEPLUv7Y'
        };

        // Initialize Supabase
        const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
        let currentUser = null;
        let isAdmin = false;

        // Menu Toggle
        const hamburger = document.getElementById('hamburger');
        const sideMenu = document.getElementById('sideMenu');
        const orderModal = document.getElementById('orderModal');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            sideMenu.classList.toggle('active');
        });

        // Close side menu when clicking a nav link
        sideMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                sideMenu.classList.remove('active');
                hamburger.classList.remove('active');
            });
        });

        // Path-based router
        function navigateTo(path) {
            history.pushState(null, '', path);
            navigate();
        }

        function navigate() {
            const path = window.location.pathname;
            const views = document.querySelectorAll('.view');
            views.forEach(v => v.classList.remove('active'));

            if (path === '/orderbook') {
                document.getElementById('orderbookView').classList.add('active');
                document.body.classList.remove('landing');
                loadEquities();
            } else if (path === '/home') {
                document.getElementById('landingView').classList.add('active');
                document.body.classList.add('landing');
            } else {
                // Redirect unknown paths to /home
                history.replaceState(null, '', '/home');
                document.getElementById('landingView').classList.add('active');
                document.body.classList.add('landing');
            }
        }

        window.addEventListener('popstate', navigate);

        // Detect OAuth callback — PKCE uses ?code= in query, implicit uses #access_token in hash
        const isAuthCallback = window.location.search.includes('code=') || window.location.hash.includes('access_token');

        // Handle SPA redirect from 404.html (only when NOT an auth callback)
        const redirectPath = sessionStorage.getItem('redirect');
        if (redirectPath) {
            sessionStorage.removeItem('redirect');
            if (!isAuthCallback) {
                history.replaceState(null, '', redirectPath);
            }
        }

        // Check admin status from profiles table
        async function checkAdmin() {
            if (!currentUser) { isAdmin = false; return; }
            const { data } = await sb.from('profiles').select('is_admin').eq('id', currentUser.id).single();
            isAdmin = data?.is_admin || false;
        }

        // Check auth state on load
        sb.auth.getSession().then(async ({ data: { session } }) => {
            if (session) {
                currentUser = session.user;
                await checkAdmin();
                updateAuthUI();
            }
        });

        // Listen for auth changes (handles OAuth redirect)
        sb.auth.onAuthStateChange(async (event, session) => {
            currentUser = session?.user || null;
            await checkAdmin();
            updateAuthUI();
            if (event === 'SIGNED_IN') {
                // Clean auth tokens from URL and go to orderbook
                history.replaceState(null, '', '/orderbook');
                navigate();
            }
        });

        function updateAuthUI() {
            const authBar = document.getElementById('authBar');
            if (currentUser) {
                const name = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || 'User';
                const avatar = currentUser.user_metadata?.avatar_url;
                authBar.innerHTML = `
                    <div class="user-info">
                        ${avatar ? `<img src="${avatar}" alt="">` : ''}
                        <span>${name}</span>
                        ${isAdmin ? '<span class="admin-badge">Admin</span>' : ''}
                    </div>
                    <button class="logout-btn" onclick="logoutUser()">Sign Out</button>
                `;
            } else {
                authBar.innerHTML = '<button class="login-btn" id="loginBtn" onclick="loginWithDiscord()">Sign in with Discord</button>';
            }
            // Refresh orderbook to show/hide admin controls
            if (window.location.pathname === '/orderbook') loadEquities();
        }

        async function loginWithDiscord() {
            const { error } = await sb.auth.signInWithOAuth({
                provider: 'discord',
                options: {
                    redirectTo: window.location.origin
                }
            });
            if (error) console.error('Login error:', error);
        }

        async function logoutUser() {
            await sb.auth.signOut();
            currentUser = null;
            isAdmin = false;
            updateAuthUI();
        }

        // Skip initial navigate during OAuth callback — let Supabase read tokens first
        if (!isAuthCallback) {
            navigate();
        }

        // Load equities from Supabase
        async function loadEquities() {
            const equityData = document.getElementById('equityData');

            try {
                // Fetch equities with their order book entries
                const { data: equities, error: eqError } = await sb
                    .from('equities')
                    .select('*')
                    .eq('is_active', true)
                    .order('ticker');

                if (eqError) throw eqError;

                let obQuery = sb.from('order_book').select('*');
                if (!isAdmin) obQuery = obQuery.gt('quantity_available', 0);
                const { data: orderBook, error: obError } = await obQuery;

                if (obError) throw obError;

                if (!equities || equities.length === 0) {
                    equityData.innerHTML = '<p class="loading">No equities listed yet.</p>';
                    return;
                }

                // Group order book by equity
                const bookByEquity = {};
                orderBook.forEach(entry => {
                    if (!bookByEquity[entry.equity_id]) bookByEquity[entry.equity_id] = { bid: [], ask: [] };
                    bookByEquity[entry.equity_id][entry.side].push(entry);
                });

                let html = '<div class="carousel-wrapper">';
                html += '<button class="carousel-arrow" id="arrowLeft" onclick="carouselPrev()">&lt;</button>';
                html += '<div class="carousel-stage">';

                let cardCount = 0;
                equities.forEach(eq => {
                    const book = bookByEquity[eq.id] || { bid: [], ask: [] };
                    const bidEntries = book.bid.sort((a, b) => b.price - a.price); // highest bid first
                    const askEntries = book.ask.sort((a, b) => a.price - b.price); // lowest ask first

                    const isUnavailable = bidEntries.length === 0 && askEntries.length === 0;

                    const tiers = JSON.stringify({
                        buy: askEntries.map(e => ({ price: Number(e.price), qty: e.quantity_available, id: e.id })),
                        sell: bidEntries.map(e => ({ price: Number(e.price), qty: e.quantity_available, id: e.id }))
                    }).replace(/"/g, '&quot;');

                    // Build bid (sell) offers HTML - left side
                    let bidHTML = '';
                    if (isAdmin) {
                        bidEntries.forEach(e => {
                            bidHTML += `
                                <div class="admin-offer-row" data-id="${e.id}">
                                    <label>$</label><input class="admin-inline-input" type="number" value="${Number(e.price)}" data-field="price" data-id="${e.id}" step="any" min="0">
                                    <label>x</label><input class="admin-inline-input" type="number" value="${e.quantity_available}" data-field="qty" data-id="${e.id}" min="0">
                                    <button class="admin-remove-tier" onclick="adminRemoveTier(${e.id})" title="Remove tier">&times;</button>
                                </div>`;
                        });
                        bidHTML += `<button class="admin-add-tier" onclick="adminAddTier(${eq.id}, 'bid')">+ Add bid tier</button>`;
                    } else if (bidEntries.length > 0) {
                        bidEntries.forEach(e => {
                            bidHTML += `
                                <div class="book-offer">
                                    <span class="offer-info"><span class="price">$${Number(e.price)}</span><span class="qty">${e.quantity_available} shares</span></span>
                                    <button onclick='openOrderForm("SELL", "${eq.ticker}", ${tiers}, ${eq.id})'>Sell</button>
                                </div>`;
                        });
                    } else {
                        bidHTML = '<span class="book-empty">No bids</span>';
                    }

                    // Build ask (buy) offers HTML - right side
                    let askHTML = '';
                    if (isAdmin) {
                        askEntries.forEach(e => {
                            askHTML += `
                                <div class="admin-offer-row" data-id="${e.id}">
                                    <label>$</label><input class="admin-inline-input" type="number" value="${Number(e.price)}" data-field="price" data-id="${e.id}" step="any" min="0">
                                    <label>x</label><input class="admin-inline-input" type="number" value="${e.quantity_available}" data-field="qty" data-id="${e.id}" min="0">
                                    <button class="admin-remove-tier" onclick="adminRemoveTier(${e.id})" title="Remove tier">&times;</button>
                                </div>`;
                        });
                        askHTML += `<button class="admin-add-tier" onclick="adminAddTier(${eq.id}, 'ask')">+ Add ask tier</button>`;
                    } else if (askEntries.length > 0) {
                        askEntries.forEach(e => {
                            askHTML += `
                                <div class="book-offer">
                                    <span class="offer-info"><span class="price">$${Number(e.price)}</span><span class="qty">${e.quantity_available} shares</span></span>
                                    <button onclick='openOrderForm("BUY", "${eq.ticker}", ${tiers}, ${eq.id})'>Buy</button>
                                </div>`;
                        });
                    } else {
                        askHTML = '<span class="book-empty">No asks</span>';
                    }

                    const showBody = isAdmin || !isUnavailable;

                    html += `
                        <div class="equity-card ${isUnavailable && !isAdmin ? 'unavailable' : ''}" data-ticker="${eq.ticker.toLowerCase()}" data-company="${eq.company_name.toLowerCase()}" data-equity-id="${eq.id}">
                            <div class="equity-card-header">
                                <span class="ticker-display">${eq.ticker}</span>
                                <span class="company-name">${eq.company_name}</span>
                            </div>
                            ${!showBody ? '<div class="unavailable-label">Not currently traded</div>' : `
                            <div class="equity-card-body">
                                <div class="book-side bid">
                                    <div class="book-side-label">Bid</div>
                                    ${bidHTML}
                                </div>
                                <div class="book-side ask">
                                    <div class="book-side-label">Ask</div>
                                    ${askHTML}
                                </div>
                            </div>
                            ${isAdmin ? `<div class="admin-actions" style="padding: 0 2rem 1rem; justify-content: center;">
                                <button class="admin-edit-btn save" onclick="adminSaveCard(${eq.id})">Save Changes</button>
                            </div>` : ''}`}
                        </div>
                    `;
                    cardCount++;
                });

                html += '</div>'; // close carousel-stage
                html += '<button class="carousel-arrow" id="arrowRight" onclick="carouselNext()">&gt;</button>';
                html += '</div>'; // close carousel-wrapper

                equityData.innerHTML = html;

                // Initialize single-card carousel
                carouselIndex = 0;
                updateCarousel();

            } catch (error) {
                console.error('Error loading equities:', error);
                equityData.innerHTML = '<p class="loading">Error loading equities. Please check console for details.</p>';
            }
        }

        // Real-time subscription — refresh orderbook when inventory changes
        sb.channel('order_book_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'order_book' }, () => {
                if (window.location.pathname === '/orderbook') loadEquities();
            })
            .subscribe();

        // Single-card carousel
        let carouselIndex = 0;

        function getVisibleCards() {
            return Array.from(document.querySelectorAll('.equity-card:not(.filtered-out)'));
        }

        function updateCarousel() {
            const cards = getVisibleCards();
            const allCards = document.querySelectorAll('.equity-card');
            // Hide all cards
            allCards.forEach(c => c.classList.remove('active-card'));

            // Show no results
            let noResults = document.getElementById('noResults');
            if (cards.length === 0) {
                if (!noResults) {
                    noResults = document.createElement('div');
                    noResults.id = 'noResults';
                    noResults.className = 'no-results';
                    noResults.textContent = 'No equities match your search.';
                    document.querySelector('.carousel-stage')?.appendChild(noResults);
                }
                noResults.style.display = 'block';
                return;
            } else if (noResults) {
                noResults.style.display = 'none';
            }

            // Wrap around
            if (carouselIndex >= cards.length) carouselIndex = 0;
            if (carouselIndex < 0) carouselIndex = cards.length - 1;

            // Show active card
            cards[carouselIndex].classList.add('active-card');
        }

        function carouselPrev() {
            carouselIndex--;
            updateCarousel();
        }

        function carouselNext() {
            carouselIndex++;
            updateCarousel();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (window.location.pathname !== '/orderbook') return;
            if (document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') carouselPrev();
            if (e.key === 'ArrowRight') carouselNext();
        });

        // Touch swipe support
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            if (window.location.pathname !== '/orderbook') return;
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (window.location.pathname !== '/orderbook') return;
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) carouselNext();
                else carouselPrev();
            }
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.equity-card');

            cards.forEach(card => {
                const ticker = card.dataset.ticker || '';
                const company = card.dataset.company || '';
                const match = !query || ticker.includes(query) || company.includes(query);
                card.classList.toggle('filtered-out', !match);
            });

            carouselIndex = 0;
            updateCarousel();
        });

        // Order form state
        let currentOrder = {};

        // Open order form
        function openOrderForm(type, ticker, tiers, equityId) {
            // Require login
            if (!currentUser) {
                loginWithDiscord();
                return;
            }

            const availableTiers = type === 'BUY' ? tiers.buy : tiers.sell;

            if (availableTiers.length === 0) return;

            currentOrder = { type, ticker, tiers: availableTiers, equityId };

            const orderTitle = document.getElementById('orderTitle');
            const orderSummary = document.getElementById('orderSummary');

            orderTitle.textContent = `${type} ${ticker}`;

            // Build tier selection
            let tierHTML = '<p style="margin-bottom: 1rem;"><span class="label">Select Price Tier:</span></p>';
            availableTiers.forEach((tier, index) => {
                const isFirst = index === 0;
                tierHTML += `
                    <div style="margin-bottom: 0.75rem;">
                        <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer; padding: 0.75rem; background: rgba(255,255,255,0.05); border-radius: 4px; border: 2px solid ${isFirst ? 'var(--accent)' : 'transparent'};" id="tierLabel${index}">
                            <input type="radio" name="tier" value="${index}" ${isFirst ? 'checked' : ''} style="width: auto; cursor: pointer;" onchange="updateOrderTier(${index})">
                            <span style="flex: 1;">
                                <strong style="color: var(--text);">${tier.qty} shares</strong> @
                                <strong style="color: ${type === 'BUY' ? '#a8d4a0' : '#d4a0a0'};">$${tier.price}</strong> each
                            </span>
                        </label>
                    </div>
                `;
            });

            orderSummary.innerHTML = tierHTML;

            // Set initial tier
            updateOrderTier(0);

            orderModal.classList.add('active');
        }

        // Update selected tier
        function updateOrderTier(tierIndex) {
            const tier = currentOrder.tiers[tierIndex];
            currentOrder.selectedTier = tier;
            currentOrder.selectedTierIndex = tierIndex;

            // Update visual selection
            currentOrder.tiers.forEach((_, index) => {
                const label = document.getElementById(`tierLabel${index}`);
                if (label) {
                    label.style.borderColor = index === tierIndex ? 'var(--accent)' : 'transparent';
                }
            });

            // Update max quantity
            const qtyInput = document.getElementById('quantity');
            const maxQtyLabel = document.getElementById('maxQtyLabel');
            if (qtyInput) {
                qtyInput.max = tier.qty;
                qtyInput.value = Math.min(qtyInput.value || 1, tier.qty);
            }
            if (maxQtyLabel) {
                maxQtyLabel.textContent = `(max ${tier.qty})`;
            }
        }

        // Validate quantity input
        function validateQuantity() {
            const qtyInput = document.getElementById('quantity');
            if (!currentOrder.selectedTier) return;

            const qty = parseInt(qtyInput.value);
            if (qty > currentOrder.selectedTier.qty) {
                qtyInput.value = currentOrder.selectedTier.qty;
            }
            if (qty < 1) {
                qtyInput.value = 1;
            }
        }

        // Cancel order
        document.getElementById('cancelOrder').addEventListener('click', () => {
            orderModal.classList.remove('active');
            document.getElementById('orderForm').reset();
        });

        // Submit order
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const ign = document.getElementById('minecraftIGN').value;
            const quantity = document.getElementById('quantity').value;
            const notes = document.getElementById('notes').value;

            if (!currentOrder.selectedTier) {
                alert('Please select a price tier');
                return;
            }

            // Validate quantity
            if (parseInt(quantity) > currentOrder.selectedTier.qty) {
                alert(`Maximum quantity for this tier is ${currentOrder.selectedTier.qty} shares`);
                return;
            }

            // Calculate total
            const total = (parseFloat(currentOrder.selectedTier.price) * parseFloat(quantity)).toFixed(2);

            const discordName = currentUser?.user_metadata?.full_name || currentUser?.user_metadata?.name || 'Unknown';

            try {
                // 1. Insert order into Supabase
                const { data: order, error: orderError } = await sb
                    .from('orders')
                    .insert({
                        user_id: currentUser.id,
                        equity_id: currentOrder.equityId,
                        side: currentOrder.type.toLowerCase(),
                        price: currentOrder.selectedTier.price,
                        quantity: parseInt(quantity),
                        minecraft_ign: ign,
                        notes: notes || null
                    })
                    .select()
                    .single();

                if (orderError) throw orderError;

                // 2. Also send Discord notification
                const payload = {
                    embeds: [{
                        title: `New ${currentOrder.type} Order - ${currentOrder.ticker}`,
                        color: currentOrder.type === 'BUY' ? 0xa8d4a0 : 0xd4a0a0,
                        fields: [
                            { name: 'Order ID', value: `#${order.id}`, inline: true },
                            { name: 'Ticker', value: currentOrder.ticker, inline: true },
                            { name: 'Type', value: currentOrder.type, inline: true },
                            { name: 'Price per Share', value: `$${currentOrder.selectedTier.price}`, inline: true },
                            { name: 'Quantity', value: quantity, inline: true },
                            { name: 'Total Value', value: `$${total}`, inline: true },
                            { name: 'Discord', value: discordName, inline: true },
                            { name: 'Minecraft IGN', value: ign, inline: true },
                            { name: 'Notes', value: notes || 'None', inline: false }
                        ],
                        timestamp: new Date().toISOString(),
                        footer: { text: 'Pavian Exchange — Approve in Supabase dashboard' }
                    }]
                };

                fetch(CONFIG.discordWebhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(err => console.warn('Discord webhook failed:', err));

                alert('Order submitted! You will be notified via Discord when it is approved.');
                orderModal.classList.remove('active');
                document.getElementById('orderForm').reset();

            } catch (error) {
                console.error('Error submitting order:', error);
                alert('Error submitting order. Please try again.');
            }
        });

        // Close order modal when clicking outside
        orderModal.addEventListener('click', (e) => {
            if (e.target === orderModal) {
                orderModal.classList.remove('active');
                document.getElementById('orderForm').reset();
            }
        });

        // ---- Admin Functions ----

        // Save all edited prices/quantities for a given equity card
        async function adminSaveCard(equityId) {
            if (!isAdmin) return;
            const card = document.querySelector(`.equity-card[data-equity-id="${equityId}"]`);
            if (!card) return;

            const inputs = card.querySelectorAll('.admin-inline-input');
            const updates = {};

            inputs.forEach(input => {
                const id = input.dataset.id;
                const field = input.dataset.field;
                if (!updates[id]) updates[id] = {};
                if (field === 'price') updates[id].price = parseFloat(input.value) || 0;
                if (field === 'qty') updates[id].quantity_available = parseInt(input.value) || 0;
            });

            try {
                for (const [id, data] of Object.entries(updates)) {
                    const { error } = await sb.from('order_book').update(data).eq('id', parseInt(id));
                    if (error) throw error;
                }
                // Real-time subscription will auto-refresh, but give instant feedback
                const btn = card.querySelector('.admin-edit-btn.save');
                if (btn) {
                    btn.textContent = 'Saved!';
                    setTimeout(() => { btn.textContent = 'Save Changes'; }, 1500);
                }
            } catch (err) {
                console.error('Admin save error:', err);
                alert('Error saving changes: ' + err.message);
            }
        }

        // Add a new tier to bid or ask side
        async function adminAddTier(equityId, side) {
            if (!isAdmin) return;

            // Determine the next tier number
            const { data: existing } = await sb.from('order_book')
                .select('tier')
                .eq('equity_id', equityId)
                .eq('side', side)
                .order('tier', { ascending: false })
                .limit(1);

            const nextTier = existing && existing.length > 0 ? existing[0].tier + 1 : 1;

            try {
                const { error } = await sb.from('order_book').insert({
                    equity_id: equityId,
                    side: side,
                    price: 0,
                    quantity_available: 0,
                    tier: nextTier
                });
                if (error) throw error;
                // Real-time will refresh the UI
            } catch (err) {
                console.error('Add tier error:', err);
                alert('Error adding tier: ' + err.message);
            }
        }

        // Remove a tier from order book
        async function adminRemoveTier(bookId) {
            if (!isAdmin) return;
            if (!confirm('Remove this tier?')) return;

            try {
                const { error } = await sb.from('order_book').delete().eq('id', bookId);
                if (error) throw error;
                // Real-time will refresh the UI
            } catch (err) {
                console.error('Remove tier error:', err);
                alert('Error removing tier: ' + err.message);
            }
        }
    </script>
</body>
</html>
