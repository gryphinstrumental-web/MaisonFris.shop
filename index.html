<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maíson Fris — Luxury and Customs</title>
    <meta name="description" content="Maison Fris — Luxury and Customs on CivMC">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <link rel="icon" type="image/png" href="2.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #646e96;
            --bg-dark: #5a5a80;
            --text: #f0eef4;
            --text-muted: #c4c0d4;
            --accent: #b8b4cc;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            position: relative;
        }

        body.landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Hamburger Menu */
        .hamburger {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 1000;
            cursor: pointer;
            width: 30px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .hamburger:hover {
            transform: scale(1.1);
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background: var(--text);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(8px, -8px);
        }

        /* Side Menu */
        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(90, 90, 128, 0.98);
            backdrop-filter: blur(10px);
            z-index: 999;
            transition: left 0.4s ease;
            padding: 5rem 2rem 2rem;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .side-menu.active {
            left: 0;
        }

        .side-menu nav {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .side-menu nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(184, 180, 204, 0.2);
        }

        .side-menu nav a:hover {
            color: var(--text);
            padding-left: 0.5rem;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: min(320px, 80vw);

            animation: fadeIn 1.8s ease;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: var(--accent);
            opacity: 0.6;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
        }

        .come-in-btn {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-muted);
            background: none;
            border: 1px solid rgba(184, 180, 204, 0.3);
            padding: 0.75rem 2.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.4s ease;
            animation: fadeIn 2.2s ease;
        }

        .come-in-btn:hover {
            color: var(--text);
            border-color: var(--accent);
            background: rgba(184, 180, 204, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .status {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a8d4a0;
            box-shadow: 0 0 8px rgba(168, 212, 160, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .links {
            margin-top: 1.5rem;
            display: flex;
            gap: 2rem;
            animation: fadeIn 2.2s ease;
        }

        .links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }

        .links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--text);
            transition: width 0.3s ease;
        }

        .links a:hover {
            color: var(--text);
        }

        .links a:hover::after {
            width: 100%;
        }

        /* Views - page routing */
        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Orderbook Page */
        .orderbook-page {
            min-height: 100vh;
            overflow-y: auto;
            padding: 2rem;
        }

        .exchange-content {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
        }


        .exchange-header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .exchange-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        /* Search Bar */
        .search-bar {
            position: relative;
            max-width: 400px;
            margin: 0 auto 2rem;
        }

        .search-bar input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(184, 180, 204, 0.2);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-align: center;
            transition: all 0.3s ease;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.12);
        }


        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .equity-card.filtered-out {
            display: none !important;
        }

        /* Carousel - single card with arrows */
        .carousel-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .carousel-arrow {
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: color 0.3s ease;
            user-select: none;
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
        }

        .carousel-arrow:hover {
            color: var(--text);
        }

        .carousel-stage {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden;
        }

        .equity-card {
            display: none;
            max-width: 560px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(184, 180, 204, 0.1);
            border-radius: 10px;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease, max-width 0.3s ease;
            animation: cardFadeIn 0.3s ease;
        }

        .equity-card.admin-card {
            max-width: 680px;
        }

        .equity-card.active-card {
            display: block;
        }

        .equity-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(184, 180, 204, 0.2);
        }

        .equity-card.unavailable {
            opacity: 0.5;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .equity-card-header {
            padding: 1.5rem 2rem 0.75rem;
            text-align: center;
        }

        .equity-card-header .ticker-display {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.08em;
            display: block;
            margin-bottom: 0.2rem;
        }

        .equity-card-header .company-name {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            display: block;
        }

        .equity-card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .book-side {
            padding: 1.25rem 2rem 1.75rem;
        }


        .book-side.bid {
            border-left: 1px solid rgba(184, 180, 204, 0.1);
        }

        .book-side-label {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-align: center;
        }

        .book-offer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
        }

        .book-offer .offer-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
        }

        .book-offer .offer-info .price {
            font-weight: 500;
            font-size: 1.05rem;
            color: var(--text);
        }

        .book-offer .offer-info .qty {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .book-offer button {
            padding: 0.5rem 1.25rem;
            border: 1px solid rgba(184, 180, 204, 0.4);
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Raleway', sans-serif;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .book-offer button:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--text);
        }

        .book-empty {
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.5;
            font-style: italic;
            text-align: center;
            width: 100%;
        }

        .unavailable-label {
            padding: 0.5rem 2rem 1.5rem;
            font-size: 0.8rem;
            color: #d4a0a0;
            font-style: italic;
            opacity: 0.7;
            text-align: center;
        }


        @media (max-width: 600px) {
            .equity-card-body {
                grid-template-columns: 1fr;
            }
            .book-side.bid {
                border-left: none;
                border-top: 1px solid rgba(184, 180, 204, 0.1);
            }
            .book-side {
                padding: 0.75rem 1.25rem 1rem;
            }
            .equity-card-header {
                padding: 1.25rem 1.25rem 0.5rem;
            }
            .equity-card-header .ticker-display {
                font-size: 1.6rem;
            }
            .carousel-arrow {
                font-size: 1.4rem;
            }
        }

        /* Top Nav Bar */
        .auth-bar {
            margin-top: auto;
            padding: 1.5rem 0;
            border-top: 1px solid rgba(184, 180, 204, 0.2);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .auth-bar .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: rgba(88, 101, 242, 0.2);
            border: 1px solid rgba(88, 101, 242, 0.5);
            border-radius: 6px;
            color: #c4c0d4;
            font-family: 'Raleway', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .auth-bar .login-btn:hover {
            background: rgba(88, 101, 242, 0.35);
            color: var(--text);
        }

        .auth-bar .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .auth-bar .user-info img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(184, 180, 204, 0.3);
        }

        .auth-bar .logout-btn {
            background: none;
            border: 1px solid rgba(184, 180, 204, 0.2);
            border-radius: 4px;
            color: var(--text-muted);
            font-family: 'Raleway', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            padding: 0.25rem 0.6rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .auth-bar .logout-btn:hover {
            border-color: rgba(212, 160, 160, 0.5);
            color: #d4a0a0;
        }

        /* Admin Controls */
        .admin-badge {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: rgba(168, 212, 160, 0.15);
            border: 1px solid rgba(168, 212, 160, 0.3);
            color: #a8d4a0;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            margin-left: 0.5rem;
        }

        .admin-edit-btn {
            background: none;
            border: 1px solid rgba(184, 180, 204, 0.2);
            color: var(--text-muted);
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            transition: all 0.2s ease;
        }

        .admin-edit-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .admin-edit-btn.save {
            border-color: rgba(168, 212, 160, 0.4);
            color: #a8d4a0;
        }

        .admin-edit-btn.save:hover {
            background: rgba(168, 212, 160, 0.15);
        }

        .admin-edit-btn.cancel {
            border-color: rgba(212, 160, 160, 0.3);
            color: #d4a0a0;
        }

        .admin-inline-input {
            width: 70px;
            padding: 0.25rem 0.4rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(184, 180, 204, 0.3);
            border-radius: 3px;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            font-size: 0.8rem;
            text-align: center;
        }

        .admin-view-toggle {
            position: absolute;
            top: 0.5rem;
            right: 0;
            background: none;
            border: 1px solid rgba(184, 180, 204, 0.3);
            border-radius: 4px;
            color: var(--text-muted);
            font-family: 'Raleway', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.35rem 0.75rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .admin-view-toggle:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .admin-inline-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .admin-offer-row {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 0.5rem;
        }

        .admin-offer-row label {
            font-size: 0.65rem;
            color: var(--text-muted);
            min-width: 14px;
            text-align: right;
        }

        .admin-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }

        .admin-add-tier {
            background: none;
            border: 1px dashed rgba(184, 180, 204, 0.25);
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 0.4rem;
        }

        .admin-add-tier:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .admin-remove-tier {
            background: none;
            border: none;
            color: rgba(212, 160, 160, 0.6);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0 0.2rem;
            line-height: 1;
        }

        .admin-remove-tier:hover {
            color: #d4a0a0;
        }

        /* Order Form Modal */
        .order-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .order-modal.active {
            display: flex;
        }

        .order-form {
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .order-form h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .order-form .form-group {
            margin-bottom: 1.5rem;
        }

        .order-form label {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .order-form input,
        .order-form textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(184, 180, 204, 0.3);
            border-radius: 4px;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            font-size: 0.9rem;
        }

        .order-form input:focus,
        .order-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .order-form .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .order-form button {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-family: 'Raleway', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .order-form button.submit-btn {
            background: rgba(184, 180, 204, 0.2);
            color: var(--text);
        }

        .order-form button.submit-btn:hover {
            background: rgba(184, 180, 204, 0.3);
        }

        .order-form button.cancel-btn {
            background: transparent;
            color: var(--text-muted);
        }

        .order-form button.cancel-btn:hover {
            color: var(--text);
        }

        .order-summary {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .order-summary p {
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .order-summary .label {
            color: var(--text-muted);
        }

        .order-summary .value {
            color: var(--text);
            font-weight: 500;
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            z-index: 1;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Hamburger Menu -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <nav>
            <a href="/home" onclick="navigateTo('/home'); return false;">Home</a>
            <a href="/orderbook" onclick="navigateTo('/orderbook'); return false;">Pavian Exchange Orderbook</a>
            <a href="/profile" id="profileLink" onclick="navigateTo('/profile'); return false;" style="display:none;">Profile</a>
        </nav>
        <div class="auth-bar" id="authBar">
            <button class="login-btn" id="loginBtn" onclick="loginWithDiscord()">Sign in</button>
        </div>
    </div>

    <!-- Landing Page View -->
    <div class="view" id="landingView">
        <div class="container">
            <img src="2.png" alt="Maison Fris" class="logo">
            <button class="come-in-btn" id="comeInBtn" onclick="loginWithDiscord()">Come In</button>
        </div>
    </div>

    <!-- Orderbook Page View -->
    <div class="view orderbook-page" id="orderbookView">
        <div class="exchange-content">

            <div class="exchange-header">
                <h1>Pavian Exchange Orderbook</h1>
                <button id="adminViewToggle" class="admin-view-toggle" style="display:none;" onclick="toggleAdminView()">Client View</button>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search by ticker or company name...">
            </div>
            <div id="equityData" class="loading">Loading equities...</div>
        </div>
    </div>

    <!-- Profile Page View -->
    <div class="view orderbook-page" id="profileView">
        <div class="exchange-content" style="max-width: 500px;">
            <div class="exchange-header">
                <h1>Profile</h1>
            </div>
            <div class="order-form" style="box-shadow: none; background: rgba(255,255,255,0.04); border: 1px solid rgba(184,180,204,0.1); border-radius: 10px;">
                <form id="profileForm" onsubmit="saveProfile(event)">
                    <div class="form-group">
                        <label for="profileIGN">Minecraft IGN</label>
                        <input type="text" id="profileIGN" placeholder="Your in-game name">
                    </div>
                    <div class="form-group">
                        <label for="profileNation">Nation</label>
                        <input type="text" id="profileNation" placeholder="Your nation">
                    </div>
                    <div class="form-group">
                        <label for="profileMB">Monument Bank Account</label>
                        <input type="text" id="profileMB" placeholder="HS-XXXX">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">Save Profile</button>
                    </div>
                </form>
                <div id="profileSaveMsg" style="text-align:center; margin-top:1rem; font-size:0.8rem; color:#a8d4a0; display:none;">Profile saved!</div>
            </div>
        </div>
    </div>

    <!-- Order Form Modal -->
    <div class="order-modal" id="orderModal">
        <div class="order-form">
            <h2 id="orderTitle">Place Order</h2>

            <div class="order-summary" id="orderSummary"></div>

            <form id="orderForm">
                <div class="form-group">
                    <label for="minecraftIGN">Minecraft IGN *</label>
                    <input type="text" id="minecraftIGN" required placeholder="Your IGN">
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity * <span id="maxQtyLabel" style="color: var(--text-muted); font-weight: 300;"></span></label>
                    <input type="number" id="quantity" required min="1" placeholder="Number of shares" oninput="validateQuantity()">
                </div>

                <div class="form-actions">
                    <button type="button" class="cancel-btn" id="cancelOrder">Cancel</button>
                    <button type="submit" class="submit-btn">Submit Order</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js?v=12"></script>
</body>
</html>
